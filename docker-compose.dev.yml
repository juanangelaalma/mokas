version: '3.8'

services:
  mokas-db:
    image: postgres:15-alpine
    container_name: mokas-db
    environment:
      - POSTGRES_USER=mokas
      - POSTGRES_PASSWORD=mokas_secret
      - POSTGRES_DB=mokas_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mokas -d mokas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
